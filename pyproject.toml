[project]
name = "solar-vs-diesel-uk-monitoring"
version = "1.0.0"
description = "Techno-economic feasibility of off-grid solar PV–battery systems for remote environmental monitoring in the UK: a comparative study across four climatic regimes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pvlib>=0.11.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/ii0mer/solar-vs-diesel-uk-monitoring"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
